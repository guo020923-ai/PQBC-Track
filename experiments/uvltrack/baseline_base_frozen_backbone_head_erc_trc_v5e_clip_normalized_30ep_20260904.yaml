DATA:
  CONTEXT_GAP: 20
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 2
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 1
  TRAIN:
    DATASETS_NAME: [GOT10K_vottrain, LASOT, TNL2K, OTB99]
    DATASETS_RATIO: [1, 1, 1, 0.2]
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME: [OTB99_test, TNL2K_test, LASOT_test]
  VALTRACK:
    DATASETS_NAME: [LASOT_test, LASOTEXT, OTB99_test, TNL2K_test]
    DATASETS_RATIO: [1, 1, 1, 1]
    SAMPLE_PER_EPOCH: 6400
  VALVL:
    DATASETS_NAME: [LASOT_test, LASOTEXT, OTB99_test, TNL2K_test]
    DATASETS_RATIO: [1, 1, 1, 1]
    SAMPLE_PER_EPOCH: 6400
MODEL:
  HIDDEN_DIM: 768
  POSITION_EMBEDDING: sine
  BACKBONE:
    FUSION_LAYER: [6, 7, 8, 9, 10, 11]
    TYPE: modality_unified_feature_extractor
    PRETRAINED_PATH: 'pretrain/mae_pretrain_vit_base.pth'
    CONT_LOSS_LAYER: [3, 4, 5, 6, 7, 8, 9, 10, 11]
    TXT_TOKEN_MODE: 'cls'
    LANGUAGE:
      TYPE: 'pretrain/bert'
      PATH: 'pretrain/bert/bert-base-uncased.tar.gz'
      VOCAB_PATH: 'pretrain/bert/bert-base-uncased-vocab.txt'
  HEAD:
    HEAD_DIM: 256
    TYPE: modality_adaptive_box_head
    OFFSET_SIGMOID: true
    CLS_TOKENIZE: false
    JOINT_CLS: false
    SOFTMAX_ONE: true
    ERC:
      ENABLED: true
      DESIGN: target_reference_erc_trc_v5d_decoupled_balanced
      MAX_ALPHA: 0.50
      TRC_HIDDEN_DIM: 32
      TRC_TEMPERATURE: 1.0
      TRC_D_MAX: 4.0
      TRC_PERMISSION_THRESHOLD: 0.15
      TRC_PERMISSION_INITIAL_PROBABILITY: 0.05
      INFERENCE_MODE: FULL_ERC
      EPS: 0.000001
      DETACH_FEATURES: true
      APPLY_VL_TRACKING_ONLY: true
      MATCH_TEST_HANN: true
      FORCE_OFF: false
TRAIN:
  MODE: joint
  GROUNDING_RATIO: 0.11
  VL_RATIO: 0.44
  BACKBONE_MULTIPLIER: 0.1
  BATCH_SIZE: 16
  EPOCH: 30
  GIOU_WEIGHT: 2.0
  GRAD_CLIP_NORM: 0.1
  L1_WEIGHT: 5.0
  AUX_WEIGHT: 0.1
  CONT_WEIGHT: 1.0
  CIB_WEIGHT: 0.01
  CTR_RATIO: 0.75
  ERC_TRC_V5D_PERMISSION_WEIGHT: 1.0
  ERC_TRC_V5D_PERMISSION_RANK_WEIGHT: 1.0
  ERC_TRC_V5D_PERMISSION_RANK_MARGIN: 0.5
  ERC_TRC_V5D_PERMISSION_POS_BOUNDARY_WEIGHT: 0.25
  ERC_TRC_V5D_PERMISSION_NEG_BOUNDARY_WEIGHT: 0.25
  ERC_TRC_V5D_PERMISSION_BOUNDARY_MARGIN: 0.25
  ERC_TRC_V5D_PERMISSION_BOUNDARY_TEMPERATURE: 0.10
  # Preserve the audited 4.8 T:C ratio without magnifying rare-T gradients
  # before the unchanged global 0.1 gradient clipping step.
  ERC_TRC_V5D_DIRECTION_WEIGHT: 0.20833333333333334
  ERC_TRC_V5D_DIRECTION_CONT_WEIGHT: 4.8
  ERC_TRC_V5D_DIRECTION_MARGIN_WEIGHT: 0.10416666666666667
  ERC_TRC_V5D_DIRECTION_MARGIN: 0.5
  ERC_TRC_V5D_STRENGTH_WEIGHT: 0.5
  ERC_TRC_V5D_DECISION_WEIGHT: 1.0
  ERC_TRC_V5D_PRESERVE_WEIGHT: 0.5
  ERC_TRC_V5D_RISK_WEIGHT: 1.0
  ERC_TRC_V5D_ORACLE_STEPS: 11
  ERC_TRC_V5D_SCORE_TEMPERATURE: 0.10
  ERC_TRC_V5D_MIN_TARGET_GAIN: 0.05
  ERC_TRC_V5D_DECISION_MARGIN: 0.05
  ERC_TRC_V5D_MARGIN_TEMPERATURE: 0.10
  INIT_CHECKPOINT: '/root/autodl-tmp/UVLTrack-master/checkpoints/train/uvltrack/baseline_base/UVLTrack_ep0300.pth.tar'
  ERC_ONLY: false
  FREEZE_BACKBONE: true
  FREEZE_HEAD_BN_STATS: true
  HEAD_ANCHOR_ENABLE: true
  HEAD_ANCHOR_WEIGHT: 0.00001
  HEAD_RESPONSE_DISTILL_ENABLE: true
  HEAD_RESPONSE_DISTILL_WEIGHT: 0.20
  HEAD_RESPONSE_DISTILL_TEMPERATURE: 1.0
  LR: 0.00004
  HEAD_LR: 0.000002
  ERC_LR: 0.00004
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: CosineAnnealingLR
    T_MAX: 100
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  SAVE_EVERY_EPOCH: true
  WEIGHT_DECAY: 0.0001
  DYNAMIC_CLS: true
  REDUCTION: mean
  GAUSSIAN_IOU: 0.7
TEST:
  MODE: NLBBOX
  EPOCH: 30
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  UPDATE_INTERVAL: 20
