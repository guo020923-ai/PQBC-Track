DATA:
  CONTEXT_GAP: 20
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 2
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 1
  TRAIN:
    DATASETS_NAME: [GOT10K_vottrain, LASOT, TNL2K, OTB99]
    DATASETS_RATIO: [1, 1, 1, 0.2]
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME: [OTB99_test, TNL2K_test, LASOT_test]
  VALTRACK:
    DATASETS_NAME: [LASOT_test, LASOTEXT, OTB99_test, TNL2K_test]
    DATASETS_RATIO: [1, 1, 1, 1]
    SAMPLE_PER_EPOCH: 6400
  VALVL:
    DATASETS_NAME: [LASOT_test, LASOTEXT, OTB99_test, TNL2K_test]
    DATASETS_RATIO: [1, 1, 1, 1]
    SAMPLE_PER_EPOCH: 6400

MODEL:
  HIDDEN_DIM: 768
  POSITION_EMBEDDING: sine
  BACKBONE:
    FUSION_LAYER: [6, 7, 8, 9, 10, 11]
    TYPE: modality_unified_feature_extractor
    PRETRAINED_PATH: 'pretrain/mae_pretrain_vit_base.pth'
    CONT_LOSS_LAYER: [3, 4, 5, 6, 7, 8, 9, 10, 11]
    TXT_TOKEN_MODE: 'cls'
    LANGUAGE:
      TYPE: 'pretrain/bert'
      PATH: 'pretrain/bert/bert-base-uncased.tar.gz'
      VOCAB_PATH: 'pretrain/bert/bert-base-uncased-vocab.txt'
  HEAD:
    HEAD_DIM: 256
    TYPE: modality_adaptive_box_head
    OFFSET_SIGMOID: true
    CLS_TOKENIZE: false
    JOINT_CLS: false
    SOFTMAX_ONE: true
    ERC:
      ENABLED: true
      DESIGN: response_hann_hardpeak_v8
      HIDDEN_DIM: 64
      REGIONAL_HIDDEN_DIM: 32
      DROP: 0.0
      MAX_ALPHA: 0.20
      GLOBAL_ALPHA_SCALE: 0.10
      REGION_ALPHA_SCALE: 0.10
      RESPONSE_TOPK: 10
      INFERENCE_MODE: FULL_ERC
      EPS: 0.000001
      LOG_RATIO_CLIP: 8.0
      DETACH_FEATURES: false
      RELIABILITY_GATED_ALPHA: false
      DETACH_RELIABILITY_GATE: false
      RELIABILITY_GATE_FLOOR: 0.0
      APPLY_VL_TRACKING_ONLY: true
      MATCH_TEST_HANN: true
      DIRECTION_SCALE: 3.0
      DELTA_SCALE: 0.0
      GATE_PRIOR: 0.05
      DETACH_RELIABILITY_FOR_ALPHA: true
      FORCE_OFF: false

TRAIN:
  MODE: joint
  GROUNDING_RATIO: 0.11
  VL_RATIO: 0.44
  BACKBONE_MULTIPLIER: 0.1
  BATCH_SIZE: 16
  EPOCH: 30
  GIOU_WEIGHT: 2.0
  GRAD_CLIP_NORM: 0.1
  L1_WEIGHT: 5.0
  AUX_WEIGHT: 0.1
  CONT_WEIGHT: 1.0
  CIB_WEIGHT: 0.01
  CTR_RATIO: 0.75

  # Legacy v1-v6 candidate-level objectives remain disabled.
  ERC_RELIABILITY_WEIGHT: 0.0
  ERC_RELIABILITY_LOSS: smooth_l1
  ERC_RELIABILITY_LOW_IOU_WEIGHT: 0.0
  ERC_RELIABILITY_RANK_WEIGHT: 0.0
  ERC_RELIABILITY_RANK_MARGIN: 0.05
  ERC_RANK_WEIGHT: 0.0
  ERC_RANK_LOSS: soft_iou
  ERC_RANK_TOPK: 0
  ERC_RANK_TEMPERATURE: 0.25
  ERC_ALPHA_REG_WEIGHT: 0.0
  ERC_ALPHA_SATURATION_RATIO: 0.9
  ERC_NORMALIZED_ALPHA_REG: false
  ERC_ALPHA_SUP_WEIGHT: 0.0
  ERC_ALPHA_TARGET_STEPS: 0
  ERC_ALPHA_TARGET_MIN_GAIN: 0.0
  ERC_ALPHA_TARGET_POS_WEIGHT: 1.0
  ERC_DECISION_WEIGHT: 0.0
  ERC_DECISION_MARGIN: 0.0
  ERC_GATE_WEIGHT: 0.0
  ERC_GATE_SCALE: 0.05
  ERC_GATE_POS_WEIGHT: 1.0
  ERC_NOHARM_WEIGHT: 0.0
  ERC_DELTA_WEIGHT: 0.0
  ERC_HARM_WEIGHT: 0.0
  ERC_HARM_IOU_DEADZONE: 0.005
  ERC_HARM_SCORE_MARGIN: 0.02
  ERC_GEO_WEIGHT: 0.0
  ERC_GEO_TOPK: 0
  ERC_GEO_TEMPERATURE: 0.25

  # ERC-v7 distribution objectives are disabled in v8.
  ERC_RESPONSE_MAP_WEIGHT: 0.0
  ERC_RESPONSE_RANK_WEIGHT: 0.0
  ERC_RESPONSE_REL_WEIGHT: 0.0
  ERC_RESPONSE_GATE_WEIGHT: 0.0
  ERC_RESPONSE_PREF_WEIGHT: 0.0
  ERC_RESPONSE_NOHARM_WEIGHT: 0.0
  ERC_RESPONSE_IDENTITY_WEIGHT: 0.0
  ERC_RESPONSE_SMOOTH_WEIGHT: 0.0
  ERC_RESPONSE_TAU: 1.0
  ERC_RESPONSE_GAIN_SCALE: 0.02
  ERC_RESPONSE_ALPHA_GAIN_SCALE: 0.21
  ERC_RESPONSE_PREF_SCALE: 0.35
  ERC_RESPONSE_ALPHA_ORACLE_STEPS: 41
  ERC_RESPONSE_GATE_TARGET_MODE: combined_response
  ERC_RESPONSE_GATE_NEG_POS_RATIO: 3
  ERC_RESPONSE_GATE_NEG_ONLY_WEIGHT: 0.1
  ERC_RESPONSE_RANK_TOPK: 10
  ERC_RESPONSE_RANK_MARGIN: 0.05
  ERC_RESPONSE_Q_GOOD: 0.50
  ERC_RESPONSE_M_GOOD: 0.45

  # ERC-v8 Hann-aware hard-peak objectives.  HARD_REACH_MARGIN is finalized
  # only after the required VALVL and online reachability audits.
  ERC_V8_HARD_CORRECT_WEIGHT: 1.0
  ERC_V8_MAP_WEIGHT: 0.25
  ERC_V8_REL_WEIGHT: 0.1
  ERC_V8_GATE_WEIGHT: 0.2
  ERC_V8_PREF_WEIGHT: 0.05
  ERC_V8_HARD_PRESERVE_WEIGHT: 0.50
  ERC_V8_MARGIN_NOHARM_WEIGHT: 0.50
  ERC_V8_SMOOTH_WEIGHT: 0.001
  ERC_V8_HARD_PRESERVE_WEIGHT_EPOCH1: 0.10
  ERC_V8_HARD_PRESERVE_WEIGHT_EPOCH2: 0.25
  ERC_V8_MARGIN_NOHARM_WEIGHT_EPOCH1: 0.10
  ERC_V8_MARGIN_NOHARM_WEIGHT_EPOCH2: 0.25
  ERC_V8_HARD_REACH_MARGIN: 0.02
  ERC_V8_HARD_SCORE_MARGIN: 0.05
  ERC_V8_PRESERVE_MARGIN: 0.05
  ERC_V8_MARGIN_TOLERANCE: 0.01
  ERC_V8_GATE_NEG_POS_RATIO: 3
  ERC_V8_GATE_NEG_ONLY_WEIGHT: 0.1
  ERC_V8_TAU: 1.0
  ERC_V8_PREF_SCALE: 0.35
  ERC_V8_OLD_TOPK_RANK_WEIGHT: 0.0

  ERC_GATE_ALPHA_CURRICULUM: true
  ERC_GATE_ALPHA_CURRICULUM_VALUES: [0.0, 0.25, 0.50, 0.75, 1.0]
  ERC_SAFETY_CURRICULUM: true

  INIT_CHECKPOINT: '/root/autodl-tmp/UVLTrack-master/checkpoints/train/uvltrack/baseline_base/UVLTrack_ep0300.pth.tar'
  ERC_ONLY: false
  FREEZE_BACKBONE: true
  FREEZE_HEAD_BN_STATS: true
  HEAD_ANCHOR_ENABLE: true
  HEAD_ANCHOR_WEIGHT: 0.00001
  HEAD_RESPONSE_DISTILL_ENABLE: false
  LR: 0.00004
  HEAD_LR: 0.000002
  ERC_LR: 0.00004
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: CosineAnnealingLR
    T_MAX: 100
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  SAVE_EVERY_EPOCH: true
  WEIGHT_DECAY: 0.0001
  DYNAMIC_CLS: true
  REDUCTION: mean
  GAUSSIAN_IOU: 0.7

TEST:
  MODE: NLBBOX
  EPOCH: 30
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  UPDATE_INTERVAL: 20
